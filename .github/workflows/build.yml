name: Build ShopScannerNeu

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate fresh project
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/shopscanner/neu

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "ShopScannerNeu"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
            id("com.android.application") version "8.5.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
          }
          android {
            namespace = "com.shopscanner.neu"
            compileSdk = 34
            defaultConfig {
              applicationId = "com.shopscanner.neu"
              minSdk = 24
              targetSdk = 34
              versionCode = 17
              versionName = "1.7"
            }
            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
            buildFeatures { compose = true }
            composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }
          dependencies {
            val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
            implementation(composeBom)
            implementation("androidx.core:core-ktx:1.13.1")
            implementation("androidx.activity:activity-compose:1.9.1")
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.foundation:foundation")
            implementation("com.google.android.gms:play-services-code-scanner:16.1.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
              android:label="ShopScannerNeu"
              android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/shopscanner/neu/MainActivity.kt
          package com.shopscanner.neu

          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.text.KeyboardActions
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalFocusManager
          import androidx.compose.ui.text.input.ImeAction
          import androidx.compose.ui.unit.dp
          import com.google.mlkit.vision.codescanner.GmsBarcodeScannerOptions
          import com.google.mlkit.vision.codescanner.GmsBarcodeScanning

          enum class Carrier(val label: String, val url: String) {
              GLS("GLS", "https://gls-group.eu/AT/de/paketverfolgung?match="),
              DPD("DPD", "https://tracking.dpd.de/status/de_AT/parcel/"),
              HERMES("Hermes", "https://www.myhermes.at/empfangen/sendungsverfolgung/?waybill="),
              UPS("UPS", "https://www.ups.com/track?loc=de_AT&tracknum=")
          }

          data class ParseResult(
              val cleanCode: String,
              val unambiguousCarrier: Carrier?,
              val conflict: Boolean,
              val message: String
          )

          fun cleanCode(raw: String): String {
              val upper = raw.replace("\r", "").replace("\n", " ").trim().uppercase()
              if (upper.isEmpty()) return ""
              Regex("""1Z[0-9A-Z]{8,22}""").find(upper)?.let { return it.value }
              Regex("""0034[0-9]{10,20}""").find(upper)?.let { return it.value }
              Regex("""H[0-9A-Z]{9,22}""").find(upper)?.let { return it.value }
              return upper.replace(" ", "").replace("-", "")
          }

          fun parseCode(raw: String): ParseResult {
              val c = cleanCode(raw)
              if (c.isEmpty()) return ParseResult("", null, false, "Bereit (v1.7)")

              return when {
                  c.startsWith("1Z") && c.length >= 10 ->
                      ParseResult(c, Carrier.UPS, false, "Eindeutig: UPS")
                  c.startsWith("0034") && c.length >= 12 ->
                      ParseResult(c, Carrier.DPD, false, "Eindeutig: DPD")
                  c.startsWith("H") && c.length >= 10 ->
                      ParseResult(c, Carrier.HERMES, false, "Eindeutig: Hermes")
                  else ->
                      ParseResult(c, null, true, "Konflikt/Unklar: Bitte Dienstleister wählen")
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { MaterialTheme { NeuApp() } }
              }
          }

          @OptIn(ExperimentalLayoutApi::class)
          @Composable
          fun NeuApp() {
              val ctx = LocalContext.current
              val focusManager = LocalFocusManager.current
              val prefs = remember { ctx.getSharedPreferences("shopscanner_v17", Context.MODE_PRIVATE) }

              var autoOpen by remember { mutableStateOf(prefs.getBoolean("auto", false)) }
              var carrier by remember {
                  val s = prefs.getString("carrier", Carrier.GLS.name) ?: Carrier.GLS.name
                  mutableStateOf(Carrier.entries.find { it.name == s } ?: Carrier.GLS)
              }

              var glsUrl by remember { mutableStateOf(prefs.getString("url_GLS", Carrier.GLS.url) ?: Carrier.GLS.url) }
              var dpdUrl by remember { mutableStateOf(prefs.getString("url_DPD", Carrier.DPD.url) ?: Carrier.DPD.url) }
              var hermesUrl by remember { mutableStateOf(prefs.getString("url_HERMES", Carrier.HERMES.url) ?: Carrier.HERMES.url) }
              var upsUrl by remember { mutableStateOf(prefs.getString("url_UPS", Carrier.UPS.url) ?: Carrier.UPS.url) }

              var draftCode by remember { mutableStateOf("") }
              var activeCode by remember { mutableStateOf("") }
              var conflictActive by remember { mutableStateOf(false) }
              var showUrlDialog by remember { mutableStateOf(false) }
              var status by remember { mutableStateOf("Bereit (v1.7) – Nummer eingeben & Enter drücken") }

              fun urlFor(c: Carrier): String = when (c) {
                  Carrier.GLS -> glsUrl
                  Carrier.DPD -> dpdUrl
                  Carrier.HERMES -> hermesUrl
                  Carrier.UPS -> upsUrl
              }

              fun saveAll() {
                  prefs.edit()
                      .putBoolean("auto", autoOpen)
                      .putString("carrier", carrier.name)
                      .putString("url_GLS", glsUrl.trim())
                      .putString("url_DPD", dpdUrl.trim())
                      .putString("url_HERMES", hermesUrl.trim())
                      .putString("url_UPS", upsUrl.trim())
                      .commit()
              }

              fun copyToClipboard(clean: String) {
                  if (clean.isNotEmpty()) {
                      val cm = ctx.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      cm.setPrimaryClip(ClipData.newPlainText("Tracking", clean))
                  }
              }

              fun openTracking(target: Carrier, rawSource: String) {
                  val clean = cleanCode(rawSource)
                  if (clean.isEmpty()) {
                      status = "Bitte zuerst Sendungsnummer eingeben und Enter drücken"
                      return
                  }
                  activeCode = clean
                  draftCode = clean
                  carrier = target
                  conflictActive = false
                  saveAll()
                  copyToClipboard(clean)
                  val base = urlFor(target).trim().ifBlank { target.url }
                  val full = if (base.endsWith("=") || base.endsWith("/")) base + Uri.encode(clean) else base
                  ctx.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(full)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  status = "${target.label}: $clean geöffnet"
              }

              fun confirmCode(rawInput: String, fromScanner: Boolean) {
                  val res = parseCode(rawInput)
                  if (res.cleanCode.isEmpty()) {
                      activeCode = ""
                      conflictActive = false
                      status = "Keine gültige Nummer übernommen"
                      return
                  }
                  draftCode = res.cleanCode
                  activeCode = res.cleanCode
                  copyToClipboard(res.cleanCode)
                  focusManager.clearFocus()

                  if (res.unambiguousCarrier != null && !res.conflict) {
                      carrier = res.unambiguousCarrier
                      conflictActive = false
                      saveAll()
                      status = "${res.message}: ${res.cleanCode}"
                      if (autoOpen || fromScanner) {
                          openTracking(res.unambiguousCarrier, res.cleanCode)
                      }
                  } else {
                      conflictActive = true
                      status = "${res.cleanCode} – Konflikt: Bitte Dienstleister wählen"
                  }
              }

              val scanner = remember {
                  GmsBarcodeScanning.getClient(
                      ctx,
                      GmsBarcodeScannerOptions.Builder().enableAutoZoom().build()
                  )
              }

              if (showUrlDialog) {
                  AlertDialog(
                      onDismissRequest = { showUrlDialog = false },
                      title = { Text("Ziel-URLs") },
                      text = {
                          Column(
                              modifier = Modifier.verticalScroll(rememberScrollState()),
                              verticalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              OutlinedTextField(value = glsUrl, onValueChange = { glsUrl = it }, label = { Text("GLS") }, singleLine = true)
                              OutlinedTextField(value = dpdUrl, onValueChange = { dpdUrl = it }, label = { Text("DPD") }, singleLine = true)
                              OutlinedTextField(value = hermesUrl, onValueChange = { hermesUrl = it }, label = { Text("Hermes") }, singleLine = true)
                              OutlinedTextField(value = upsUrl, onValueChange = { upsUrl = it }, label = { Text("UPS") }, singleLine = true)
                          }
                      },
                      confirmButton = {
                          Button(onClick = {
                              saveAll()
                              showUrlDialog = false
                              status = "Ziel-URLs gespeichert"
                          }) { Text("Speichern") }
                      },
                      dismissButton = {
                          TextButton(onClick = { showUrlDialog = false }) { Text("Abbrechen") }
                      }
                  )
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(20.dp),
                  verticalArrangement = Arrangement.spacedBy(12.dp)
              ) {
                  Text("ShopScannerNeu v1.7", style = MaterialTheme.typography.headlineSmall)

                  Button(
                      onClick = {
                          scanner.startScan()
                              .addOnSuccessListener { bc -> bc.rawValue?.let { confirmCode(it, fromScanner = true) } }
                              .addOnFailureListener { e -> status = "Scan: ${e.localizedMessage ?: "abgebrochen"}" }
                      },
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Text("Barcode scannen")
                  }

                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      OutlinedTextField(
                          value = draftCode,
                          onValueChange = { draftCode = it },
                          label = { Text("Sendungsnummer") },
                          singleLine = true,
                          keyboardOptions = KeyboardOptions(imeAction = ImeAction.Done),
                          keyboardActions = KeyboardActions(onDone = { confirmCode(draftCode, fromScanner = false) }),
                          modifier = Modifier.weight(1f)
                      )
                      Button(
                          onClick = { confirmCode(draftCode, fromScanner = false) },
                          modifier = Modifier.height(56.dp)
                      ) {
                          Text("Enter")
                      }
                  }

                  if (conflictActive) {
                      Text(
                          "Konflikt – Dienstleister manuell wählen:",
                          style = MaterialTheme.typography.titleSmall
                      )
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(10.dp)
                      ) {
                          Button(
                              onClick = { openTracking(Carrier.GLS, activeCode.ifBlank { draftCode }) },
                              modifier = Modifier.weight(1f).height(58.dp)
                          ) { Text("GLS") }
                          Button(
                              onClick = { openTracking(Carrier.DPD, activeCode.ifBlank { draftCode }) },
                              modifier = Modifier.weight(1f).height(58.dp)
                          ) { Text("DPD") }
                      }
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(10.dp)
                      ) {
                          OutlinedButton(
                              onClick = { openTracking(Carrier.HERMES, activeCode.ifBlank { draftCode }) },
                              modifier = Modifier.weight(1f).height(54.dp)
                          ) { Text("Hermes") }
                          OutlinedButton(
                              onClick = { openTracking(Carrier.UPS, activeCode.ifBlank { draftCode }) },
                              modifier = Modifier.weight(1f).height(54.dp)
                          ) { Text("UPS") }
                      }
                  }

                  FlowRow(
                      horizontalArrangement = Arrangement.spacedBy(8.dp),
                      verticalArrangement = Arrangement.spacedBy(6.dp)
                  ) {
                      Carrier.entries.forEach { item ->
                          FilterChip(
                              selected = carrier == item,
                              onClick = {
                                  carrier = item
                                  saveAll()
                                  status = "Dienstleister: ${item.label}"
                              },
                              label = { Text(item.label) }
                          )
                      }
                  }

                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      Text("Automatisch öffnen (bei Eindeutigkeit)", modifier = Modifier.weight(1f))
                      Switch(
                          checked = autoOpen,
                          onCheckedChange = {
                              autoOpen = it
                              saveAll()
                              status = if (it) "Auto-Öffnen: AN" else "Auto-Öffnen: AUS"
                          }
                      )
                  }

                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      Button(
                          onClick = { openTracking(carrier, activeCode.ifBlank { draftCode }) },
                          modifier = Modifier.weight(1f)
                      ) { Text("Zu ${carrier.label}") }
                      OutlinedButton(
                          onClick = {
                              draftCode = ""
                              activeCode = ""
                              conflictActive = false
                              status = "Bereit (v1.7)"
                          }
                      ) { Text("Leeren") }
                  }

                  OutlinedButton(
                      onClick = { showUrlDialog = true },
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Text("Ziel-URLs bearbeiten")
                  }

                  Text(status, style = MaterialTheme.typography.bodyMedium)
              }
          }
          EOF

          gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: shopscanner-neu-apk
          path: app/build/outputs/apk/debug/app-debug.apk
