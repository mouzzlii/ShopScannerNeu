name: Build ShopScannerNeu

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate fresh project
        run: |
          mkdir -p app/src/main/java/com/shopscanner/neu

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "ShopScannerNeu"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
            id("com.android.application") version "8.5.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
          }
          android {
            namespace = "com.shopscanner.neu"
            compileSdk = 34
            defaultConfig {
              applicationId = "com.shopscanner.neu"
              minSdk = 24
              targetSdk = 34
              versionCode = 1
              versionName = "1.0"
            }
            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
            buildFeatures { compose = true }
            composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }
          dependencies {
            val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
            implementation(composeBom)
            implementation("androidx.core:core-ktx:1.13.1")
            implementation("androidx.activity:activity-compose:1.9.1")
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.foundation:foundation")
            implementation("com.google.android.gms:play-services-code-scanner:16.1.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
              android:label="ShopScannerNeu"
              android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/shopscanner/neu/MainActivity.kt
          package com.shopscanner.neu

          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import com.google.mlkit.vision.codescanner.GmsBarcodeScannerOptions
          import com.google.mlkit.vision.codescanner.GmsBarcodeScanning

          enum class Carrier(val label: String, val url: String) {
              GLS("GLS", "https://gls-group.eu/AT/de/paketverfolgung?match="),
              DPD("DPD", "https://tracking.dpd.de/status/de_AT/parcel/"),
              HERMES("Hermes", "https://www.myhermes.at/empfangen/sendungsverfolgung/?waybill="),
              UPS("UPS", "https://www.ups.com/track?loc=de_AT&tracknum=")
          }

          fun detectCarrier(raw: String): Carrier? {
              val c = raw.trim().uppercase().replace(" ", "")
              return when {
                  c.startsWith("1Z") && c.length >= 10 -> Carrier.UPS
                  c.startsWith("H") && c.length >= 10 -> Carrier.HERMES
                  c.startsWith("0034") && c.length >= 14 -> Carrier.DPD
                  (c.startsWith("01") || c.startsWith("05")) && c.length in 10..20 && c.all { it.isDigit() } -> Carrier.DPD
                  c.length in 14..20 && c.all { it.isDigit() } -> Carrier.HERMES
                  c.length in 11..13 && c.all { it.isDigit() } -> Carrier.GLS
                  else -> null
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { MaterialTheme { NeuApp() } }
              }
          }

          @OptIn(ExperimentalLayoutApi::class)
          @Composable
          fun NeuApp() {
              val ctx = LocalContext.current
              val prefs = remember { ctx.getSharedPreferences("shopscanner_neu_prefs", Context.MODE_PRIVATE) }
              val urls = remember {
                  mutableStateMapOf<Carrier, String>().apply {
                      Carrier.entries.forEach { put(it, prefs.getString("u_${it.name}", it.url) ?: it.url) }
                  }
              }
              var autoOpen by remember { mutableStateOf(prefs.getBoolean("auto", false)) }
              var carrier by remember {
                  val s = prefs.getString("c", Carrier.GLS.name) ?: Carrier.GLS.name
                  mutableStateOf(Carrier.entries.find { it.name == s } ?: Carrier.GLS)
              }
              var code by remember { mutableStateOf("") }
              var showUrls by remember { mutableStateOf(false) }
              var status by remember { mutableStateOf("Bereit") }

              fun savePrefs() {
                  prefs.edit().apply {
                      putBoolean("auto", autoOpen)
                      putString("c", carrier.name)
                      Carrier.entries.forEach { putString("u_${it.name}", (urls[it] ?: it.url).trim()) }
                      apply()
                  }
              }

              fun openTracking(target: Carrier, rawCode: String) {
                  val clean = rawCode.trim().replace(" ", "")
                  if (clean.isEmpty()) return
                  val cm = ctx.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  cm.setPrimaryClip(ClipData.newPlainText("Tracking", clean))
                  val base = (urls[target] ?: target.url).trim().ifBlank { target.url }
                  val full = if (base.endsWith("=") || base.endsWith("/")) base + Uri.encode(clean) else base
                  ctx.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(full)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  status = "${target.label} geöffnet: $clean"
              }

              fun handleCode(input: String) {
                  code = input
                  val found = detectCarrier(input)
                  if (found != null) {
                      carrier = found
                      status = "${found.label} erkannt"
                      if (autoOpen) {
                          savePrefs()
                          openTracking(found, input)
                      }
                  } else {
                      status = if (input.isBlank()) "Bereit" else "Anbieter wählen"
                  }
              }

              val scanner = remember {
                  GmsBarcodeScanning.getClient(
                      ctx,
                      GmsBarcodeScannerOptions.Builder().enableAutoZoom().build()
                  )
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(20.dp),
                  verticalArrangement = Arrangement.spacedBy(12.dp)
              ) {
                  Text("ShopScannerNeu", style = MaterialTheme.typography.headlineSmall)

                  Button(
                      onClick = {
                          scanner.startScan()
                              .addOnSuccessListener { bc -> bc.rawValue?.let { handleCode(it) } }
                              .addOnFailureListener { e -> status = "Scan: ${e.localizedMessage ?: "abgebrochen"}" }
                      },
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Text("Barcode scannen")
                  }

                  OutlinedTextField(
                      value = code,
                      onValueChange = { handleCode(it) },
                      label = { Text("Sendungsnummer") },
                      singleLine = true,
                      modifier = Modifier.fillMaxWidth()
                  )

                  FlowRow(
                      horizontalArrangement = Arrangement.spacedBy(8.dp),
                      verticalArrangement = Arrangement.spacedBy(6.dp)
                  ) {
                      Carrier.entries.forEach { item ->
                          FilterChip(
                              selected = carrier == item,
                              onClick = { carrier = item; savePrefs(); status = "Anbieter: ${item.label}" },
                              label = { Text(item.label) }
                          )
                      }
                  }

                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      Text("Automatisch öffnen", modifier = Modifier.weight(1f))
                      Switch(checked = autoOpen, onCheckedChange = { autoOpen = it; savePrefs() })
                  }

                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      Button(
                          onClick = { savePrefs(); openTracking(carrier, code) },
                          modifier = Modifier.weight(1f)
                      ) { Text("Zu ${carrier.label}") }
                      OutlinedButton(onClick = { code = ""; status = "Bereit" }) { Text("Leeren") }
                  }

                  TextButton(onClick = { showUrls = !showUrls }) {
                      Text(if (showUrls) "URLs ausblenden" else "Ziel-URLs bearbeiten")
                  }

                  if (showUrls) {
                      Carrier.entries.forEach { item ->
                          OutlinedTextField(
                              value = urls[item] ?: "",
                              onValueChange = { urls[item] = it },
                              label = { Text("${item.label}-URL") },
                              singleLine = true,
                              modifier = Modifier.fillMaxWidth()
                          )
                      }
                      Button(onClick = { savePrefs(); status = "URLs gespeichert" }, modifier = Modifier.fillMaxWidth()) {
                          Text("Speichern")
                      }
                  }

                  Text(status, style = MaterialTheme.typography.bodyMedium)
              }
          }
          EOF

          gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: shopscanner-neu-apk
          path: app/build/outputs/apk/debug/app-debug.apk
